<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX战士久留美 · 极限天台模拟器</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --green: #3fb950;
            --red: #f85149;
            --gold: #d2991d;
            --blue: #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.2s;
        }
        /* 爆仓红屏特效 */
        body.margin-call { animation: flash-red 0.5s 3; }
        @keyframes flash-red {
            0% { background-color: var(--bg); }
            50% { background-color: #4a1111; }
            100% { background-color: var(--bg); }
        }

        .app { width: 100%; max-width: 1100px; }
        header {
            display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
        }
        header h1 { font-size: 1.6rem; color: var(--red); letter-spacing: 1px; text-shadow: 0 0 10px rgba(248,81,73,0.3); }
        header .sub { font-size: 0.85rem; color: #8b949e; }
        
        .status-bar {
            display: flex; gap: 20px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px 20px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
        }
        .status-item .label { font-size: 0.75rem; color: #8b949e; }
        .status-item .value { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .value.positive { color: var(--green); }
        .value.negative { color: var(--red); }
        
        .leverage-control { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .leverage-control select {
            background: #0d1117; color: var(--gold); border: 1px solid var(--border);
            border-radius: 6px; padding: 6px 10px; font-size: 1rem; font-weight: bold;
            outline: none; cursor: pointer;
        }
        .leverage-control select option { color: var(--text); font-weight: normal; }
        
        .market-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px; margin-bottom: 16px;
        }
        .pair-card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 14px 16px; position: relative;
        }
        .pair-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .pair-name { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.5px; }
        .pair-price { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .price-up { color: var(--green); }
        .price-down { color: var(--red); }
        .pair-meta { font-size: 0.75rem; color: #8b949e; margin-bottom: 10px; }
        
        .trade-buttons { display: flex; gap: 8px; }
        .trade-buttons button {
            flex: 1; padding: 8px 0; border: none; border-radius: 6px;
            font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: all 0.15s;
        }
        .trade-buttons button:active { transform: scale(0.96); }
        .btn-long { background: rgba(63, 185, 80, 0.2); color: var(--green); border: 1px solid var(--green); }
        .btn-long:hover { background: rgba(63, 185, 80, 0.4); }
        .btn-short { background: rgba(248, 81, 73, 0.2); color: var(--red); border: 1px solid var(--red); }
        .btn-short:hover { background: rgba(248, 81, 73, 0.4); }
        
        .positions-panel {
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-bottom: 16px;
        }
        .positions-panel h2 { font-size: 1rem; margin-bottom: 10px; color: var(--blue); display: flex; justify-content: space-between;}
        .positions-panel h2 span { color: #8b949e; font-size: 0.8rem; font-weight: normal;}
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: #8b949e; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
        td.num { font-variant-numeric: tabular-nums; }
        .close-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text);
            padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; transition: all 0.2s;
        }
        .close-btn:hover { border-color: var(--red); color: var(--red); background: rgba(248,81,73,0.1); }
        .empty-positions { color: #8b949e; font-size: 0.85rem; text-align: center; padding: 20px 0; }
        
        .log-panel {
            background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            padding: 14px 16px; max-height: 180px; overflow-y: auto;
            font-size: 0.8rem; line-height: 1.7;
        }
        .log-panel .log-entry { border-bottom: 1px solid #21262d; padding: 3px 0; }
        .log-entry .time { color: #8b949e; margin-right: 8px; }
        .log-entry.long { color: var(--green); }
        .log-entry.short { color: var(--red); }
        .log-entry.warn { color: var(--gold); }
        .log-entry.liquidation { color: #fff; background: var(--red); font-weight: bold; padding: 2px 4px; border-radius: 3px; margin: 4px 0; display: inline-block;}
        .log-entry.black-swan { color: #ff7b72; font-weight: bold; font-size: 0.9rem;}
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>FX战士久留美 · 极限天台模拟器</h1>
        <span class="sub">止损是不可能止损的，这辈子都不可能止损的，只能靠补仓摊平才能维持生活。</span>
    </header>

    <div class="status-bar">
        <div class="status-item">
            <div class="label">账户净值 (JPY)</div>
            <div class="value" id="equity">100,000</div>
        </div>
        <div class="status-item">
            <div class="label">可用保证金</div>
            <div class="value" id="free-margin">100,000</div>
        </div>
        <div class="status-item">
            <div class="label">浮动盈亏</div>
            <div class="value" id="floating-pnl">0</div>
        </div>
        <div class="status-item">
            <div class="label">累计手续费</div>
            <div class="value" id="total-fees" style="color:var(--gold)">0</div>
        </div>
        <div class="leverage-control">
            <label for="leverage" style="color:var(--red); font-weight:bold;">杠杆选择</label>
            <select id="leverage">
                <option value="10">10× (安全)</option>
                <option value="100">100× (刺激)</option>
                <option value="500">500× (疯狂)</option>
                <option value="1000" selected>1000× (久留美)</option>
                <option value="5000">5000× (寻死)</option>
                <option value="10000">10000× (天台)</option>
            </select>
        </div>
    </div>

    <div class="market-grid" id="market-grid"></div>

    <div class="positions-panel">
        <h2>当前持仓 <span>（每手开仓/平仓各收 20 JPY 手续费）</span></h2>
        <div id="positions-container">
            <div class="empty-positions">暂无持仓。选择上面的货币对开始交易。</div>
        </div>
    </div>

    <div class="log-panel" id="log-panel"></div>
</div>

<script>
(() => {
    'use strict';

    // ===================== 基础配置 =====================
    const INITIAL_CAPITAL = 100000; // 10万日元
    const UPDATE_INTERVAL = 1500;   // 每1.5秒跳动一次
    const MAX_TICK_PCT = 0.001;     // 单次正常波动最大 0.1%
    const MEAN_REVERT_STRENGTH = 0.01; 
    const LIQUIDATION_THRESHOLD = 0.8; // 亏损吃掉80%可用保证金时爆仓
    const LOT_SIZE = 10000;         // 1手 = 10000基础货币
    const COMMISSION_PER_LOT = 20;  // 每手单边手续费 20 日元

    // 初始汇率 (近似2026年真实市场)
    const PAIRS = [
        { symbol: 'EUR/USD', base: 'EUR', quote: 'USD', price: 1.1237, pipSize: 0.0001, basePrice: 1.1237 },
        { symbol: 'USD/JPY', base: 'USD', quote: 'JPY', price: 158.20, pipSize: 0.01, basePrice: 158.20 },
        { symbol: 'GBP/USD', base: 'GBP', quote: 'USD', price: 1.3383, pipSize: 0.0001, basePrice: 1.3383 },
        { symbol: 'USD/CHF', base: 'USD', quote: 'CHF', price: 0.8248, pipSize: 0.0001, basePrice: 0.8248 },
        { symbol: 'AUD/USD', base: 'AUD', quote: 'USD', price: 0.7082, pipSize: 0.0001, basePrice: 0.7082 },
        { symbol: 'USD/CAD', base: 'USD', quote: 'CAD', price: 1.4057, pipSize: 0.0001, basePrice: 1.4057 }
    ];

    // ===================== 状态 =====================
    let balance = INITIAL_CAPITAL;
    let totalFeesPaid = 0;
    let positions = []; 
    let nextPositionId = 1;
    let priceFlash = {}; 

    const els = {
        equity: document.getElementById('equity'),
        freeMargin: document.getElementById('free-margin'),
        floatingPnl: document.getElementById('floating-pnl'),
        totalFees: document.getElementById('total-fees'),
        leverage: document.getElementById('leverage'),
        marketGrid: document.getElementById('market-grid'),
        positionsContainer: document.getElementById('positions-container'),
        logPanel: document.getElementById('log-panel')
    };

    // ===================== 工具函数 =====================
    function fmt(num, decimals = 0) {
        return Number(num).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function pairDecimals(pair) {
        if (pair.symbol === 'USD/JPY') return 2;
        if (pair.symbol.startsWith('USD/')) return 4;
        return 4;
    }

    function formatPrice(pair, price) {
        return price.toFixed(pairDecimals(pair));
    }

    function log(message, type = '') {
        const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span class="time">${time}</span>${message}`;
        els.logPanel.prepend(entry);
        while (els.logPanel.children.length > 60) {
            els.logPanel.removeChild(els.logPanel.lastChild);
        }
    }

    // ===================== 随机波动引擎（含黑天鹅） =====================
    function tickPrices() {
        let blackSwanOccurred = false;

        PAIRS.forEach(pair => {
            const prev = pair.price;
            const u1 = Math.random() || 1e-10;
            const u2 = Math.random();
            const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);

            const deviation = (pair.price - pair.basePrice) / pair.basePrice;
            const reversion = -MEAN_REVERT_STRENGTH * deviation;

            let changePct = z * MAX_TICK_PCT + reversion;
            changePct = Math.max(-MAX_TICK_PCT, Math.min(MAX_TICK_PCT, changePct));

            // 黑天鹅事件：0.5% 的概率触发剧烈波动 (±1% 到 ±3%)
            if (Math.random() < 0.005) {
                const direction = Math.random() > 0.5 ? 1 : -1;
                const magnitude = 0.01 + Math.random() * 0.02; // 1% ~ 3%
                changePct = direction * magnitude;
                blackSwanOccurred = true;
                log(`🚨 黑天鹅事件！${pair.symbol} 发生剧烈${direction > 0 ? '暴涨' : '暴跌'}！`, 'black-swan');
            }

            pair.price = Math.max(pair.price * (1 + changePct), 0.0001);

            if (pair.price > prev) priceFlash[pair.symbol] = 'up';
            else if (pair.price < prev) priceFlash[pair.symbol] = 'down';
            else priceFlash[pair.symbol] = null;
        });

        if (blackSwanOccurred) {
            document.body.classList.add('margin-call');
            setTimeout(() => document.body.classList.remove('margin-call'), 1500);
        }

        updateAll();
        checkLiquidation();
    }

    // ===================== 计算引擎 =====================
    function getLeverage() {
        return parseFloat(els.leverage.value) || 1000;
    }

    function notionalInJPY(pair, lots) {
        const units = lots * LOT_SIZE;
        const usdjpy = PAIRS.find(p => p.symbol === 'USD/JPY').price;

        if (pair.quote === 'JPY') return units * pair.price;
        if (pair.base === 'USD') return units * usdjpy;
        if (pair.quote === 'USD') return units * pair.price * usdjpy;
        return units * usdjpy;
    }

    function requiredMargin(pair, lots) {
        return notionalInJPY(pair, lots) / getLeverage();
    }

    function positionPnl(pos) {
        const pair = PAIRS.find(p => p.symbol === pos.symbol);
        const units = pos.lots * LOT_SIZE;
        const usdjpy = PAIRS.find(p => p.symbol === 'USD/JPY').price;

        if (pos.side === 'long') {
            if (pair.quote === 'JPY') return (pair.price - pos.entryPrice) * units;
            if (pair.quote === 'USD') return (pair.price - pos.entryPrice) * units * usdjpy;
            if (pair.base === 'USD') return (pair.price - pos.entryPrice) / pair.price * units * usdjpy;
        } else {
            if (pair.quote === 'JPY') return (pos.entryPrice - pair.price) * units;
            if (pair.quote === 'USD') return (pos.entryPrice - pair.price) * units * usdjpy;
            if (pair.base === 'USD') return (pos.entryPrice - pair.price) / pair.price * units * usdjpy;
        }
        return 0;
    }

    function totalFloatingPnl() {
        return positions.reduce((sum, pos) => sum + positionPnl(pos), 0);
    }

    function usedMargin() {
        return positions.reduce((sum, pos) => sum + requiredMargin(pos.pair, pos.lots), 0);
    }

    function equity() {
        return balance + totalFloatingPnl();
    }

    function freeMargin() {
        return equity() - usedMargin();
    }

    // ===================== 交易与手续费逻辑 =====================
    function openPosition(pair, side) {
        const lots = 1; 
        const margin = requiredMargin(pair, lots);
        const commission = lots * COMMISSION_PER_LOT;

        if (margin + commission > freeMargin()) {
            log(`保证金或手续费不足，无法${side === 'long' ? '做多' : '做空'} ${pair.symbol}。`, 'warn');
            return;
        }

        // 扣除开仓手续费
        balance -= commission;
        totalFeesPaid += commission;

        const pos = {
            id: nextPositionId++,
            symbol: pair.symbol,
            side,
            lots,
            entryPrice: pair.price,
            pair
        };
        positions.push(pos);

        const sideText = side === 'long' ? '做多' : '做空';
        log(`${sideText} ${pair.symbol} 1手 @ ${formatPrice(pair, pair.price)} (手续费 -${commission} JPY)`, side);
        updateAll();
    }

    function closePosition(posId) {
        const idx = positions.findIndex(p => p.id === posId);
        if (idx === -1) return;

        const pos = positions[idx];
        const pnl = positionPnl(pos);
        const commission = pos.lots * COMMISSION_PER_LOT;
        
        balance += (pnl - commission);
        totalFeesPaid += commission;
        positions.splice(idx, 1);

        const sign = pnl >= 0 ? '+' : '';
        log(`平仓 ${pos.symbol} ${pos.side === 'long' ? '多' : '空'} · 盈亏 ${sign}${fmt(pnl)} JPY (手续费 -${commission} JPY)`, pnl >= 0 ? 'long' : 'short');
        updateAll();
    }

    // ===================== 爆仓判定 =====================
    function checkLiquidation() {
        if (positions.length === 0) return;

        const equityNow = equity();
        const used = usedMargin();

        // 爆仓条件：净值 <= 已用保证金的 20%
        if (equityNow <= used * (1 - LIQUIDATION_THRESHOLD) && used > 0) {
            let totalPnl = 0;
            positions.forEach(pos => {
                totalPnl += positionPnl(pos);
            });
            balance += totalPnl;
            positions = [];

            document.body.classList.add('margin-call');
            setTimeout(() => document.body.classList.remove('margin-call'), 2000);

            log(`💀 强制平仓！触发 Margin Call！净值仅剩 ${fmt(equityNow)} JPY。`, 'liquidation');
            log(`久留美：“怎么会这样...明明只要再扛一下就能回本了...”`, 'warn');
            updateAll();
        }
    }

    // ===================== 渲染 UI =====================
    function renderMarket() {
        els.marketGrid.innerHTML = PAIRS.map(pair => {
            const flash = priceFlash[pair.symbol];
            const priceClass = flash === 'up' ? 'price-up' : flash === 'down' ? 'price-down' : '';
            const decimals = pairDecimals(pair);
            
            // 显示当前杠杆下的所需保证金
            const reqMargin = requiredMargin(pair, 1);

            return `
                <div class="pair-card">
                    <div class="pair-header">
                        <span class="pair-name">${pair.symbol}</span>
                        <span class="pair-price ${priceClass}" id="price-${pair.symbol.replace('/', '-')}">
                            ${formatPrice(pair, pair.price)}
                        </span>
                    </div>
                    <div class="pair-meta">
                        1手所需保证金 ≈ <span style="color:var(--gold)">${fmt(reqMargin, 2)}</span> JPY
                    </div>
                    <div class="trade-buttons">
                        <button class="btn-long" data-action="long" data-symbol="${pair.symbol}">做多</button>
                        <button class="btn-short" data-action="short" data-symbol="${pair.symbol}">做空</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPositions() {
        if (positions.length === 0) {
            els.positionsContainer.innerHTML = '<div class="empty-positions">暂无持仓。选择上面的货币对开始交易。</div>';
            return;
        }

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>货币对</th><th>方向</th><th>手数</th><th>入场价</th><th>当前价</th><th>浮动盈亏 (JPY)</th><th></th>
                    </tr>
                </thead>
                <tbody>
        `;

        positions.forEach(pos => {
            const pair = pos.pair;
            const pnl = positionPnl(pos);
            const pnlClass = pnl >= 0 ? 'positive' : 'negative';
            const sideText = pos.side === 'long' ? '多' : '空';
            const sideClass = pos.side === 'long' ? 'price-up' : 'price-down';

            html += `
                <tr>
                    <td>${pos.symbol}</td>
                    <td class="${sideClass}">${sideText}</td>
                    <td class="num">${pos.lots}</td>
                    <td class="num">${formatPrice(pair, pos.entryPrice)}</td>
                    <td class="num">${formatPrice(pair, pair.price)}</td>
                    <td class="num ${pnlClass}">${pnl >= 0 ? '+' : ''}${fmt(pnl)}</td>
                    <td><button class="close-btn" data-close="${pos.id}">平仓</button></td>
                </tr>
            `;
        });

        html += '</tbody></table>';
        els.positionsContainer.innerHTML = html;
    }

    function renderStatus() {
        const eq = equity();
        const fm = freeMargin();
        const pnl = totalFloatingPnl();

        els.equity.textContent = fmt(eq);
        els.freeMargin.textContent = fmt(Math.max(fm, 0));
        els.floatingPnl.textContent = (pnl >= 0 ? '+' : '') + fmt(pnl);
        els.totalFees.textContent = fmt(totalFeesPaid);

        els.equity.className = 'value ' + (eq >= INITIAL_CAPITAL ? 'positive' : 'negative');
        els.freeMargin.className = 'value ' + (fm >= 0 ? 'positive' : 'negative');
        els.floatingPnl.className = 'value ' + (pnl >= 0 ? 'positive' : 'negative');
    }

    function updateAll() {
        renderMarket();
        renderPositions();
        renderStatus();
    }

    // ===================== 事件绑定 =====================
    els.marketGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const symbol = btn.dataset.symbol;
        const pair = PAIRS.find(p => p.symbol === symbol);
        if (pair) openPosition(pair, action);
    });

    els.positionsContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-close]');
        if (!btn) return;
        closePosition(parseInt(btn.dataset.close, 10));
    });

    // 切换杠杆时重新计算保证金
    els.leverage.addEventListener('change', () => {
        updateAll();
        log(`杠杆已调整为 ${getLeverage()}×。`, 'warn');
    });

    // ===================== 启动 =====================
    renderMarket();
    renderStatus();
    log('极限模拟器已启动。默认 1000倍 杠杆。祝你好运，久留美。', 'warn');

    setInterval(() => {
        tickPrices();
    }, UPDATE_INTERVAL);

    setInterval(() => {
        priceFlash = {};
        updateAll();
    }, UPDATE_INTERVAL * 4);

})();
</script>
</body>
</html>
